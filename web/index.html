<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>实验室报价系统</title>
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="theme-color" content="#e9eef7">
<script>
/* 主题预置：在样式表生效前把主题写到 <html>，避免刷新时闪白/闪黑 */
(function () {
  var t = 'light';
  try { t = localStorage.getItem('lq-theme') === 'dark' ? 'dark' : 'light'; } catch (e) { /* 隐私模式默认明亮 */ }
  document.documentElement.dataset.theme = t;
})();
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 2v6l-5 9a2 2 0 0 0 1.7 3h12.6A2 2 0 0 0 20 17l-5-9V2"/><path d="M8 2h8"/><path d="M7.5 14h9"/>
        </svg>
      </div>
      <div>
        <h1>实验室报价系统</h1>
        <p>LAB QUOTATION</p>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot" id="sidebarFoot">数据保存在本机 · 支持离线使用</div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div>
        <h2 id="pageTitle">仪表盘</h2>
      </div>
      <div class="topbar-actions">
        <button class="theme-toggle" id="themeToggle" title="切换明亮 / 深色主题" aria-label="切换主题">
          <svg class="ico-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
          <svg class="ico-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <div id="topActions"></div>
      </div>
    </header>
    <div class="content" id="view"></div>
  </div>
</div>
<div id="modalRoot"></div>
<div class="toast-wrap" id="toastWrap"></div>
<script src="core.js"></script>
<script src="views.js"></script>
<script src="quote.js"></script>
<script>bootstrap();</script>
</body>
</html>
